<main class="container py-4" style="max-width: 400px">
  <h1 class="mb-4">Log in</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="card">
    <div class="card-body">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" type="text" formControlName="username" class="form-control" />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" formControlName="password" class="form-control" />
      </div>

      @if (loginError()) {
        <p class="text-danger small">{{ loginError() }}</p>
      }

      <button type="submit" [disabled]="submitting()" class="btn btn-primary">
        @if (submitting()) {
          Logging in…
        } @else {
          Log in
        }
      </button>
    </div>
  </form>
</main>
